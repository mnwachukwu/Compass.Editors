name: Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
    # For COMPASS_TOKEN, which the checkout of Compass falls back from where it is unset.
    secrets: inherit
